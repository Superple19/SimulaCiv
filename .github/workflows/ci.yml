name: CI

on:
  push:
    branches: [main, ci-check]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-2025
          - macos-26
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install pinned just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Run Rust checks
        run: just ci-rust

  analysis:
    name: Analysis tooling
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Install pinned Python
        run: uv python install

      - name: Install pinned Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: "1.10.19"

      - name: Install pinned just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install pinned Vale
        run: |
          curl -fsSL https://github.com/vale-cli/vale/releases/download/v3.25.1/vale_3.25.1_Linux_64-bit.tar.gz -o /tmp/vale.tar.gz
          echo "4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182  /tmp/vale.tar.gz" | sha256sum --check
          tar -xzf /tmp/vale.tar.gz -C /tmp
          sudo install -m 0755 /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Install pinned prek
        run: |
          curl -fsSL https://github.com/j178/prek/releases/download/v0.5.7/prek-x86_64-unknown-linux-gnu.tar.gz -o /tmp/prek.tar.gz
          echo "e238e5a6b4e384e8d18f33d3c3b1a329be0e1237f77ac6e021e641ddd3a2bab6  /tmp/prek.tar.gz" | sha256sum --check
          tar -xzf /tmp/prek.tar.gz -C /tmp
          sudo install -m 0755 /tmp/prek-x86_64-unknown-linux-gnu/prek /usr/local/bin/prek
          prek --version

      - name: Run analysis checks
        run: just ci-analysis
