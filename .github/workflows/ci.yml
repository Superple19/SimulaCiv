name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  analysis:
    name: Analysis tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.5"

      - name: Install pinned Python
        run: uv python install

      - name: Install pinned Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"

      - name: Install pinned just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Install pinned Vale
        run: |
          curl -fsSL https://github.com/vale-cli/vale/releases/download/v3.25.1/vale_3.25.1_Linux_64-bit.tar.gz -o /tmp/vale.tar.gz
          echo "4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182  /tmp/vale.tar.gz" | sha256sum --check
          tar -xzf /tmp/vale.tar.gz -C /tmp
          sudo install -m 0755 /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Check analysis tooling and reports
        run: just check
