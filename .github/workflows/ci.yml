name: CI

on:
  push:
    branches: [main, ci-check]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_VERSION: "2026.10.18"

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: "aqua:casey/just"
    strategy:
      fail-fast: false
      matrix:
        # The pinned GA labels are x64 for Ubuntu/Windows and arm64 for macOS.
        os:
          - ubuntu-26.04
          - windows-2025
          - macos-26
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install mise-managed tools
        uses: jdx/mise-action@v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Run Rust checks
        run: just ci-rust

  analysis:
    name: Analysis tooling
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install mise-managed tools
        uses: jdx/mise-action@v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install pinned Python
        run: uv python install --directory analysis

      - name: Show analysis Python version
        run: uv run --directory analysis --project . python -c "import sys; print(sys.version)"

      - name: Run analysis checks
        run: just ci-analysis

  promote:
    name: Promote
    needs: [checks, analysis]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ci-check' && needs.checks.result == 'success' && needs.analysis.result == 'success' }}
    runs-on: ubuntu-26.04
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out full history at tested commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fast-forward main
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ${#TESTED_SHA} -ne 40 ]]; then
            echo "::error::Refusing promotion: workflow run has an invalid head SHA" >&2
            exit 1
          fi
          case "$TESTED_SHA" in
            *[!0-9a-f]*)
              echo "::error::Refusing promotion: workflow run has an invalid head SHA" >&2
              exit 1
              ;;
          esac
          git fetch --no-tags origin main
          if ! tested_sha="$(git rev-parse --verify "${TESTED_SHA}^{commit}" 2>/dev/null)"; then
            echo "::error::Refusing promotion: tested commit $TESTED_SHA is not available" >&2
            exit 1
          fi
          main_sha="$(git rev-parse --verify refs/remotes/origin/main)"
          if [[ "$main_sha" == "$tested_sha" ]]; then
            echo "main already points to $tested_sha; no promotion needed"
            exit 0
          fi
          if git merge-base --is-ancestor "$tested_sha" "$main_sha"; then
            echo "tested commit $tested_sha is already an ancestor of origin/main ($main_sha); skipping older overlapping run"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$main_sha" "$tested_sha"; then
            echo "::error::Refusing promotion: $tested_sha is not a descendant of origin/main ($main_sha); main was not changed" >&2
            exit 1
          fi
          git push origin "$tested_sha:refs/heads/main"
