default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext
          - md
          - --markdown-linebreak-ext
          - qmd
        exclude: '^(?:docs/data/|docs/reports/(?!M5_).*|docs/contracts/(?:M1_CONTRACT_FREEZE|M2_OPTIMIZATION_CONTRACT|M3_INTERACTION_CONTRACT|M4_COUNTERFACTUAL_CONTRACT)\.md$|docs/design/|crates/sim-model/examples/m4_02_a[2-4]_measure\.rs$)'
      - id: end-of-file-fixer
        exclude: '^(?:docs/data/|docs/reports/(?!M5_).*|docs/contracts/(?:M1_CONTRACT_FREEZE|M2_OPTIMIZATION_CONTRACT|M3_INTERACTION_CONTRACT|M4_COUNTERFACTUAL_CONTRACT)\.md$|docs/design/|crates/sim-model/examples/m4_02_a[2-4]_measure\.rs$)'
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: '^(?:docs/data/|docs/reports/(?!M5_).*|docs/contracts/(?:M1_CONTRACT_FREEZE|M2_OPTIMIZATION_CONTRACT|M3_INTERACTION_CONTRACT|M4_COUNTERFACTUAL_CONTRACT)\.md$|docs/design/|crates/sim-model/examples/m4_02_a[2-4]_measure\.rs$)'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: dvc-large-files
        name: block staged files over 1 MiB unless DVC-managed
        entry: uv run --directory analysis --project . python -m simciv_analysis.git_hooks
        language: system
        stages: [pre-commit]

      - id: data-integrity
        name: verify docs/data checksums
        entry: uv run --directory analysis --project . python -m simciv_analysis.data_integrity --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: forbid-utf8-bom
        name: reject UTF-8 BOM in text files
        entry: uv run --directory analysis --project . python -m simciv_analysis.git_hooks --check-bom
        language: system
        types: [text]
        exclude: '^docs/data/'
        stages: [pre-commit]

      - id: vale-changed-docs
        name: Vale changed Markdown and Quarto files
        entry: vale --config analysis/vale/.vale.ini
        language: system
        files: '^(?:docs/reproducibility/.*\.(?:md|qmd)|docs/(?:reports|performance)/M5_[^/]+\.(?:md|qmd))$'
        stages: [pre-commit]

      - id: links-changed-docs
        name: check links in changed Markdown and Quarto files
        entry: uv run --directory analysis --project . python check_links.py
        language: system
        files: '.*\.(md|qmd)$'
        stages: [pre-commit]

      - id: allowlist-commit-message
        name: enforce the commit message allowlist
        entry: uv run --directory analysis --project . python -m simciv_analysis.git_hooks --check-commit-message
        language: system
        stages: [commit-msg]

      - id: forbid-dvc-local-config
        name: forbid local DVC credentials
        entry: "^"
        language: pygrep
        files: '^\.dvc/config\.local$'
        stages: [pre-commit]

      - id: pre-push-clippy
        name: cargo clippy before push
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pre-push-clippy-cross
        name: cross-target cargo clippy before push
        entry: just clippy-cross
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pre-push-analysis
        name: just check before push
        entry: just check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pre-push-ci-clean
        name: just ci-clean before push
        entry: just ci-clean
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pre-push-ci-linux
        name: just ci-linux before push
        entry: just ci-linux
        language: system
        pass_filenames: false
        stages: [pre-push]
