[project]
name = "simciv-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "pytest==9.1.1",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
