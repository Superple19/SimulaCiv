    - analysis/simciv_analysis/a5_evidence.py
    - analysis/simciv_analysis/a5_tonight.py
    - contracts/experiments.toml
    - contracts/hosts.toml
    - crates/sim-core/src
    - crates/sim-model/src
    - crates/sim-model/benches/m3_11_propagation_bench.rs
