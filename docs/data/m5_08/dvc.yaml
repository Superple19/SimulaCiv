stages:
  a5_m2_explicit_rayon:
    wdir: ../../..
    cmd: uv run --directory analysis --project . python -m simciv_analysis.a5_tonight stage m2
    deps:
    - Cargo.lock
    - analysis/simciv_analysis/a5_evidence.py
    - analysis/simciv_analysis/a5_tonight.py
    - contracts/experiments.toml
    - contracts/hosts.toml
    - crates/sim-core/src
    - crates/sim-model/src
    - crates/sim-model/examples/m5_06_m2_rayon_a5.rs
    - crates/sim-model/examples/common/process_controls.rs
    - rust-toolchain.toml
    outs:
    - docs/data/m5_08/m2_explicit_rayon/raw
    frozen: true
    meta:
      kind: timing
  a5_m3_09_equal_live:
