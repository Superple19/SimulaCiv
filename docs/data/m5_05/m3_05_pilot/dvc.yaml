stages:
  m3_05_a5_reconstruction:
    wdir: ../../../..
    cmd: uv run --directory analysis --project . python -m 
      simciv_analysis.m3_05_pilot --output-dir docs/data/m5_05/m3_05_pilot/raw 
      --summary docs/data/m5_05/m3_05_pilot/summary.json
    deps:
    - Cargo.lock
    - Cargo.toml
    - analysis/simciv_analysis/io.py
    - analysis/simciv_analysis/m3_05_pilot.py
    - crates/sim-model/benches/m3_scale_limit_bench.rs
    - crates/sim-model/examples/common/process_controls.rs
    - crates/sim-model/examples/m3_05_a5_reconstruction.rs
    - docs/reproducibility/m5_05_configs/m3_05_a5_pilot.toml
    - rust-toolchain.toml
    outs:
    - docs/data/m5_05/m3_05_pilot/raw
    frozen: true
    meta:
      kind: timing
