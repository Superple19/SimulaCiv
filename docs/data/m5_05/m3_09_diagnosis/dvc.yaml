stages:
  m5_05_m3_09_diagnosis:
    wdir: ../../../../
    cmd: uv run --directory analysis --project . python -m simciv_analysis.m5_05_diagnosis
      --output-dir docs/data/m5_05/m3_09_diagnosis/raw
      --summary docs/data/m5_05/m3_09_diagnosis/summary.json
    deps:
    - analysis/simciv_analysis/m5_05_diagnosis.py
    - analysis/simciv_analysis/provenance.py
    - crates/sim-model/examples/m5_05_m3_09_revision.rs
    - crates/sim-model/tests/fixtures/m3p_propagation_sustained.toml
    - docs/data/m5_05/m3_09_incremental_equal_live/summary.json
    - docs/reports/M3_09_INCREMENTAL_TOPOLOGY.md
    - docs/reproducibility/m5_05_configs/m3_09_diagnosis.toml
    outs:
    - docs/data/m5_05/m3_09_diagnosis/raw
  m5_05_m3_09_diagnosis_bisect:
    wdir: ../../../../
    cmd: uv run --project analysis python
      crates/sim-model/examples/m5_05_m3_09_bisect.py
      --run --repo .
      --plan docs/reproducibility/m5_05_configs/m3_09_diagnosis_bisect.toml
      --worker crates/sim-model/examples/m5_05_m3_09_revision.rs
      --config crates/sim-model/tests/fixtures/m3p_propagation_sustained.toml
      --clone-dir target/m5_05_m3_09_diagnosis/bisect-clone-run3
      --build-dir target/m5_05_m3_09_diagnosis/bisect-build
      --output-dir docs/data/m5_05/m3_09_diagnosis/bisect_raw
      --summary docs/data/m5_05/m3_09_diagnosis/bisect_summary.json
    deps:
    - crates/sim-model/examples/m5_05_m3_09_bisect.py
    - crates/sim-model/examples/m5_05_m3_09_revision.rs
    - crates/sim-model/tests/fixtures/m3p_propagation_sustained.toml
    - docs/reproducibility/m5_05_configs/m3_09_diagnosis_bisect.toml
    outs:
    - docs/data/m5_05/m3_09_diagnosis/bisect_raw
