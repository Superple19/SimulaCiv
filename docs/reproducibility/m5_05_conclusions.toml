schema_version = 1
stage = "M5-05"
source_host = "AMD Ryzen 5 9600X Windows desktop"
timing_protocol = "M4 A-5; see M5 contract §15.3"

[[conclusion]]
id = "m2_near_linear"
milestone = "M2"
report = "docs/reports/M2_40_FINAL_RUNTIME_PROFILE_AND_GRADUATION_GATE.md"
section = "#full-tick-scaling"
class = "timing"
verbatim_conclusion = "From 50k to 100k, whole-tick alpha ranges from 1.058 to 1.102; A has phase-local P5/P6A/P6B timing outliers, but they do not move aggregate alpha above 1.058."
comparison = "Recompute 50k-to-100k alpha for workload B Serial and Explicit Rayon."
cells = ["B N=50k K=250", "B N=100k K=500"]
config = "docs/reproducibility/m5_05_configs/m2_40.toml; day 0; metrics/events on; snapshots off"
harness = "crates/sim-model/benches/m0_baseline_bench.rs"
bench_args = ["M5-05 selector: workload B, N=50k/100k, Serial and Explicit Rayon 6/256"]
pass_criterion = "Report the new alpha and each absolute timing ratio; conclusion holds only if both modes remain near-linear over these cells, otherwise inconclusive or changed as observed."
estimate_minutes = 20
session = 1
tests = ["determinism_oracle_tests"]

[[conclusion]]
id = "m2_final_tick"
milestone = "M2"
report = "docs/reports/M2_40_FINAL_RUNTIME_PROFILE_AND_GRADUATION_GATE.md"
